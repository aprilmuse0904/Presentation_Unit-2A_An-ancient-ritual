function branchPage(index){const b={...DATA.branches[index],index},prefix='b'+index;return `<section id="branch${index}" class="section"><div class="eyebrow">PART B • BRANCH ${index+1} OF 3</div><h1>${esc(b.title)}</h1><div class="steps"><button class="step" onclick="scrollToId('${prefix}trigger')">1 Trigger</button><button class="step" onclick="scrollToId('${prefix}vocab')">2 Vocabulary</button><button class="step" onclick="scrollToId('${prefix}translation')">3 Translate</button><button class="step" onclick="scrollToId('${prefix}practice')">4 Guided practice (6 tasks)</button><button class="step" onclick="scrollToId('${prefix}speak')">5 Speaking</button></div>
<div class="card soft" id="${prefix}trigger"><span class="pill">TRIGGER &amp; CONTEXT</span><h2 style="margin-top:14px">Think &amp; Predict</h2><div class="qprompt">${esc(b.trigger)}</div><p class="muted">Read the context once to understand the main idea. Don't translate every word yet.</p><div class="context">${b.context}</div><p class="tiny muted">Bold words = target vocabulary. After flashcards, return and translate this paragraph.</p><div class="row"><button class="btn secondary small" onclick="speak(document.getElementById('${prefix}trigger').querySelector('.context').textContent,.88)">▶ Listen to context</button></div></div>
<div class="card" id="${prefix}vocab"><span class="pill">STEP 2</span><h2>New Vocabulary · 8 Words</h2><p>Tap to flip. Use 🔊 Nghe từ to hear pronunciation and 🔊 Câu ví dụ to hear the example sentence.</p>${flashcards(b.vocab,prefix+'flash_')}<div class="teacher note" style="margin-top:14px"><b>Teacher note:</b> Teach vocabulary in context; do not make students memorise definitions before reading.</div></div>
<div class="card" id="${prefix}translation"><span class="pill">STEP 3</span><h2>Read &amp; Translate</h2><div class="context">${b.context}</div><p class="muted">Translate the whole paragraph into Vietnamese. Then compare with the sample translation.</p>${textareaField(prefix+'translation','Viết bản dịch tiếng Việt ở đây...')}<div class="row" style="margin-top:12px"><button class="btn secondary" onclick="toggleAnswer('${prefix}transans')">👁 Show sample translation</button><button class="btn coral" onclick="mark('${prefix}translation_review');this.textContent='✓ Translation reviewed'">✓ I've compared my translation</button></div><div class="answer" id="${prefix}transans">${esc(b.translation)}</div><div class="note" style="margin-top:12px">Translations are open-ended. Compare meaning, vocabulary and grammar; an exact text match is not required.</div></div>
<div id="${prefix}practice"><div class="card"><span class="pill">GUIDED PRACTICE • TASK 1</span><h2>Unscramble Sentences (10)</h2><p>Click words in order to build a sentence. <b>Every sentence includes a Vietnamese hint.</b> Click an assembled word to return it to the word bank.</p>${b.orders.map((_,i)=>orderUI(b,i)).join('')}</div>
<div class="card"><span class="pill">GUIDED PRACTICE • TASK 2</span><h2>Listen &amp; Repeat (5)</h2><p>Listen to the sentence, then repeat it aloud. Slow mode uses the browser's text-to-speech voice.</p>${b.repeats.map((_,i)=>listenUI(b,i)).join('')}</div>
<div class="card"><span class="pill">GUIDED PRACTICE • TASK 3</span><h2>Choose the Best Response (5)</h2>${b.mcqs.map((_,i)=>mcqUI(b,i)).join('')}</div>
<div class="card"><span class="pill">GUIDED PRACTICE • TASK 4</span><h2>Vocabulary Recall (8)</h2><p>Translate Vietnamese into English. Type the complete word or phrase.</p>${vocabRecall(b)}</div>
<div class="card"><span class="pill">GUIDED PRACTICE • TASK 5</span><h2>Fill in the Blanks (3)</h2><div class="wordbank">Word bank: ${b.fills.map(x=>esc(x.a)).join(' • ')}</div>${b.fills.map((_,i)=>fillUI(b,i)).join('')}</div><div class="card"><span class="pill">GUIDED PRACTICE • TASK 6</span><h2>Translate Vietnamese into English (5)</h2><p>Đọc câu tiếng Việt và viết câu tiếng Anh. Các câu dùng từ vựng và cấu trúc đã học trong nhánh này.</p><div class="note">Hệ thống kiểm tra theo câu mẫu (không phân biệt chữ hoa hay dấu câu). Nếu em dùng một cách dịch đúng khác, hãy bấm <b>Show model answer</b> để tự đối chiếu hoặc hỏi giáo viên.</div>${VI_EN_EXERCISES[index].map((_,i)=>viEnUI(b,i)).join('')}</div></div>
<div class="card" id="${prefix}speak"><span class="pill">STEP 5 • SPEAKING PRODUCTION</span><h2>Speak with the Spidergram</h2><div class="speaking"><b>Ask &amp; Answer</b><ol>${b.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div><h3 style="margin-top:22px">Keywords only · Ghi chú spidergram</h3><p class="muted">${esc(b.notes)}</p><textarea id="${prefix}notes" placeholder="Enter your keywords here (no full sentences)" oninput="state.notes[${index}]=this.value;save()">${esc(state.notes[index]||'')}</textarea><h3 style="margin-top:20px">My speaking paragraph</h3>${textareaField(prefix+'speaking','Write 3–5 English sentences to prepare for speaking...')}<div class="row"><button class="btn small secondary" onclick="toggleAnswer('${prefix}model')">Show model speaking paragraph</button><button class="btn small coral" onclick="mark('${prefix}speaking_done');this.textContent='✓ Practised'">✓ I've spoken aloud</button></div><div id="${prefix}model" class="answer">${esc(b.model)}</div></div><div class="row"><button class="btn secondary" onclick="nav('${index===0?'recall':'branch'+(index-1)}')">← Previous</button><button class="btn coral" onclick="nav('${index===2?'presentation':'branch'+(index+1)}')">Next section →</button></div></section>`}
function scrollToId(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function presentationPage(){return `<section class="section" id="presentation"><div class="eyebrow">PART C • FURTHER DEVELOPMENT</div><h1>How to Open a Presentation?</h1><p class="subtitle">A strong introduction helps your audience feel curious. Practise two techniques: visuals and setting a scene.</p><div class="card"><span class="pill">TECHNIQUE 1</span><h2>Open with Visuals 🎬</h2><div class="grid3"><div class="task"><h3>🖼 Picture</h3><p>Let's look at this picture. What can you see?</p></div><div class="task"><h3>🎞 Video</h3><p>Let's watch a short video. What are the people doing?</p></div><div class="task"><h3>♫ Music</h3><p>Listen to this music. Where do you think it comes from?</p></div></div><div class="note">Opening sequence: <b>Greet → Show a visual → Ask a question → Introduce the topic.</b></div><div class="task"><b>Model:</b><p>Good morning, everyone! Let's look at this picture. What can you see? These people are taking part in an ancient Hindu ceremony called Melasti. Today, I'd like to tell you about this tradition.</p><button class="btn small secondary" onclick="speak('Good morning, everyone! Let us look at this picture. What can you see? These people are taking part in an ancient Hindu ceremony called Melasti. Today, I would like to tell you about this tradition.',.9)">▶ Listen</button></div><h3>Guided Practice · 5 blanks</h3><div class="wordbank">Word bank: picture • see • ceremony • Bali • talk</div>${['Good morning, everyone! Let’s look at this ____.','What can you ____?','This is Melasti, an ancient Hindu ____.','It takes place in ____, Indonesia.','Today, I’m going to ____ about this tradition.'].map((s,i)=>`<div class="task"><p>${i+1}. ${esc(s)}</p><input class="textinput" placeholder="Your word" value="${esc(get('visual'+i))}" oninput="set('visual${i}',this.value)"><button class="btn small" onclick="checkVocabulary('visual${i}',${attrJs(['picture','see','ceremony','Bali','talk'][i])})">Check</button><span class="status" id="visual${i}status"></span></div>`).join('')}<h3>Write your own visual opening</h3>${textareaField('visualopening','Good morning! Let’s look at this picture...')}</div>
<div class="card"><span class="pill">TECHNIQUE 2</span><h2>Setting a Scene 🌊</h2><div class="note">Opening sequence: <b>Imagine → Where you are → What you see → What you hear → Introduce the topic.</b></div><div class="task"><b>Model:</b><p>Imagine you are standing on a beautiful beach in Bali. You can hear traditional music. You can see hundreds of people wearing white clothes and carrying colourful banners. What is happening? Welcome to Melasti!</p><button class="btn small secondary" onclick="speak('Imagine you are standing on a beautiful beach in Bali. You can hear traditional music. You can see hundreds of people wearing white clothes and carrying colourful banners. What is happening? Welcome to Melasti!',.9)">▶ Listen</button></div><h3>Create your own scene</h3>${[['location','Imagine you are...','standing on a beach in Bali'],['see','You can see...','people wearing white'],['hear','You can hear...','traditional music'],['action','People are...','carrying colourful banners']].map(x=>`<div class="task"><label><b>${x[1]}</b></label><input class="textinput" id="scene_${x[0]}" placeholder="${x[2]}" value="${esc(state.openings[x[0]]||'')}" oninput="state.openings['${x[0]}']=this.value;updateScene();save()"></div>`).join('')}<h3>Your opening preview</h3><div class="speaking" id="scenePreview"></div><div class="row" style="margin-top:12px"><button class="btn secondary" onclick="copyText($('#scenePreview').textContent)">Copy my opening</button><button class="btn coral" onclick="mark('scene_completed');this.textContent='✓ Practised'">✓ I've presented my scene</button></div></div><div class="card"><h2>Choose your opening</h2><p>Pick one technique and use it at the start of your final presentation.</p><label class="choice"><input type="radio" name="openingChoice" value="visual" onchange="set('openingChoice','visual')" ${get('openingChoice')==='visual'?'checked':''}>With visuals (pictures, videos or music)</label><label class="choice"><input type="radio" name="openingChoice" value="scene" onchange="set('openingChoice','scene')" ${get('openingChoice')==='scene'?'checked':''}>Setting a scene (Imagine...)</label></div><button class="btn coral" onclick="nav('final')">Final Production →</button></section>`}
function updateScene(){const o=state.openings;$('#scenePreview').textContent=`Imagine you are ${o.location||'__________'}. You can see ${o.see||'__________'}. You can hear ${o.hear||'__________'}. People are ${o.action||'__________'}. Welcome to Melasti! Today, I'd like to tell you about this ancient ceremony.`}
function finalPage(){return `<section class="section" id="final"><div class="eyebrow">FINAL PRODUCTION • MY MELASTI PRESENTATION</div><h1>You're the Presenter! 🎤</h1><p class="subtitle">Combine your chosen opening and the three spidergram branches. Aim for 1.5–2 minutes.</p><div class="card"><h2>Your Spidergram Notes</h2>${spider()}${DATA.branches.map((b,i)=>`<div class="task"><b>${i+1}. ${esc(b.title)}</b><div class="muted">${esc(state.notes[i]||'No notes yet. Go back to Branch '+(i+1)+'.')}</div></div>`).join('')}</div><div class="card"><h2>Write Your Presentation</h2><p>Structure: <b>Opening → When &amp; Where → Reason → Parade → Closing</b></p><div class="note">Suggested closing: In my opinion, Melasti is a beautiful and meaningful ceremony. I would love to see it one day. Thank you for listening. Do you have any questions?</div><textarea style="min-height:340px" id="finalDraft" placeholder="Good morning, everyone!..." oninput="state.draft=this.value;save()">${esc(state.draft)}</textarea><div class="row" style="margin-top:13px"><button class="btn secondary" onclick="toggleAnswer('finalModel')">Reveal full model presentation</button><button class="btn secondary" onclick="copyText($('#finalDraft').value)">Copy my presentation</button><button class="btn" onclick="window.print()">🖨 Print</button><button class="btn coral" onclick="mark('final_done');this.textContent='✓ Presentation complete'">✓ I presented</button></div><div class="answer" id="finalModel">Imagine you are standing on a beautiful beach in Bali. You can hear traditional music and see people wearing white clothes. Welcome to Melasti!<br><br>${DATA.branches.map(b=>esc(b.model)).join('<br><br>')}<br><br>In my opinion, Melasti is a beautiful and meaningful ceremony. I would love to see it one day. Thank you for listening. Do you have any questions?</div></div><div class="card"><h2>Speaking Checklist · 10 points</h2>${[['Engaging opening',2],['Three complete spidergram branches',3],['Topic vocabulary',2],['Clear pronunciation and fluency',2],['Eye contact / notes, not full script',1]].map((x,i)=>`<label class="choice"><input type="checkbox" onchange="mark('rubric${i}')"> ${esc(x[0])} <b style="float:right">${x[1]} pts</b></label>`).join('')}<p class="muted tiny">Use the rubric for teacher or self-assessment.</p></div><div class="card soft"><h3>Well done! ✨</h3><p>You have practised vocabulary, reading, translation and speaking about Melasti. Review any branch from the sidebar whenever you want.</p></div></section>`}
function init(){const navEl=$('#navigation');navEl.innerHTML=sections.map(([id,label])=>`<button class="navbtn ${id==='home'?'active':''}" data-page="${id}" onclick="nav('${id}')">${label}</button>`).join('');$('#app').innerHTML=home()+recallPage()+DATA.branches.map((_,i)=>branchPage(i)).join('')+presentationPage()+finalPage();$('#teacher').addEventListener('change',e=>{document.body.classList.toggle('teacher-on',e.target.checked);document.querySelectorAll('.answer').forEach(n=>{if(e.target.checked)n.classList.add('visible');else n.classList.remove('visible')})});updateScene();updateProgress();nav('home')};init();
</script></body></html>
